<style>
/* Layout: a working handbook. Sticky chapter rail on the left, one reading column, interactive panels (tabs, filters, accordions, trackers) where the content is a structure rather than prose. Brand: royal green + white, gold for decisions. */
:root{
  --bg:#f7faf8; --surface:#ffffff; --sunk:#eef4f0; --ink:#0b2219; --ink2:#3f564c; --ink3:#6b8378;
  --green:#0f7a52; --green2:#0a5a3c; --tint:#e3f2ea; --gold:#a8771a; --goldbg:#fbf3e0; --line:#d7e4dc; --warn:#b4472f; --warnbg:#fbece8;
  --f-d:'Unbounded','Arial Black',system-ui,sans-serif; --f-b:'Manrope','Segoe UI',system-ui,sans-serif; --f-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07120d;--surface:#0d1d16;--sunk:#0a1712;--ink:#e9f4ee;--ink2:#b3c9bf;--ink3:#7f978c;--green:#3ccf91;--green2:#2fae78;--tint:#123326;--gold:#e9c46a;--goldbg:#2a2210;--line:#1f3a2e;--warn:#ff9d86;--warnbg:#33170f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07120d;--surface:#0d1d16;--sunk:#0a1712;--ink:#e9f4ee;--ink2:#b3c9bf;--ink3:#7f978c;--green:#3ccf91;--green2:#2fae78;--tint:#123326;--gold:#e9c46a;--goldbg:#2a2210;--line:#1f3a2e;--warn:#ff9d86;--warnbg:#33170f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--f-b);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:0 0 auto}
.logo svg{width:32px;height:32px}
.logo b{font:700 .9rem var(--f-d);letter-spacing:.01em}
.logo small{display:block;font:500 .62rem var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:500 .9rem var(--f-b)}
.search svg{position:absolute;left:10px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--ink3)}
.hits{font:500 .72rem var(--f-m);color:var(--ink3);white-space:nowrap}
/* layout */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;padding-block:28px 80px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail a{display:flex;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink2);font:600 .86rem/1.3 var(--f-b)}
.rail a span{flex:0 0 22px;font:500 .72rem var(--f-m);color:var(--ink3);padding-top:2px}
.rail a:hover{background:var(--sunk);color:var(--ink)}
.rail a.cur{background:var(--tint);color:var(--green2)}
:root[data-theme="dark"] .rail a.cur{color:var(--green)}
.rail .meta{margin-top:18px;padding:14px;border-radius:12px;background:var(--sunk);font-size:.8rem;color:var(--ink2)}
.rail .meta b{display:block;font:500 .66rem var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green)}
main{min-width:0}
/* hero */
.hero{padding:30px 0 34px;border-bottom:1px solid var(--line);margin-bottom:10px}
.eyebrow{font:500 .7rem var(--f-m);letter-spacing:.18em;text-transform:uppercase;color:var(--green)}
.hero h1{margin-top:12px;font:700 clamp(1.9rem,4vw,2.9rem)/1.08 var(--f-d);letter-spacing:-.02em;max-width:20ch}
.hero p{margin-top:16px;max-width:66ch;font-size:1.08rem;color:var(--ink2)}
.motto{margin-top:12px;font:600 1.05rem var(--f-b);font-style:italic;color:var(--gold)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.facts span{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 .78rem var(--f-m);color:var(--ink2)}
/* sections */
section.s{padding-top:44px;scroll-margin-top:80px}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.sh .n{font:500 .8rem var(--f-m);color:var(--green)}
.sh h2{font:700 clamp(1.3rem,2.4vw,1.7rem)/1.2 var(--f-d);letter-spacing:-.01em}
.lead{max-width:68ch;font-size:1.04rem;color:var(--ink2);margin-bottom:18px}
h3{font:700 1.02rem var(--f-b);margin:26px 0 10px}
.prose{display:grid;gap:10px;max-width:70ch;color:var(--ink2)}
.prose b{color:var(--ink)}
/* generic tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font:500 .68rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:11px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
tr:last-child td{border-bottom:0}
td b{color:var(--ink)}
td.k{font-weight:600;color:var(--ink);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
/* two-col compare */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.vs div{padding:11px 16px;border-bottom:1px solid var(--line);font-size:.92rem}
.vs div:nth-child(odd){color:var(--ink);font-weight:600;border-right:1px solid var(--line)}
.vs div:nth-child(even){color:var(--ink3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink3) 50%,transparent)}
.vs .hd{background:var(--sunk);font:500 .68rem var(--f-m)!important;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)!important;text-decoration:none!important}
.vs div:nth-last-child(-n+2){border-bottom:0}
/* chips / tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font:600 .84rem var(--f-b);cursor:pointer}
.tabs button:hover{border-color:var(--green)}
.tabs button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--surface)}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:20px 22px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px;min-width:0}
.card h4{font:700 .98rem var(--f-b)}
.card p{margin-top:6px;font-size:.88rem;color:var(--ink2)}
.card small{display:block;font:500 .66rem var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
/* principles accordion */
.pr{display:grid;gap:8px}
.pr details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pr summary{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}
.pr summary::-webkit-details-marker{display:none}
.pr summary i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--green2);font:700 .8rem var(--f-m);font-style:normal}
:root[data-theme="dark"] .pr summary i{color:var(--green)}
.pr summary b{font:700 .98rem var(--f-b)}
.pr summary em{font-style:normal;font-size:.84rem;color:var(--ink3)}
.pr summary::after{content:"+";font:500 1.2rem var(--f-m);color:var(--ink3)}
.pr details[open] summary::after{content:"−"}
.pr .body{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px 62px}
.pr .body div{padding:12px 14px;border-radius:10px;background:var(--sunk);font-size:.88rem;color:var(--ink2)}
.pr .body small{display:block;font:500 .64rem var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.pr .body div.pain small{color:var(--warn)}
.pr .body div.fix small{color:var(--green)}
/* journey */
.jtop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:12px}
.jtop b{font:700 1.02rem var(--f-b)}
.target{padding:4px 10px;border-radius:999px;background:var(--goldbg);color:var(--gold);font:500 .78rem var(--f-m)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:st}
.steps li{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px dashed var(--line);counter-increment:st}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(st);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);font:500 .76rem var(--f-m)}
.steps li span{font-size:.92rem;color:var(--ink2)}
.steps li span b{color:var(--ink)}
.steps li code{font:500 .76rem var(--f-m);color:var(--gold);white-space:nowrap}
/* layers */
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.layers>div{padding:18px;border-right:1px solid var(--line);min-width:0}
.layers>div:last-child{border-right:0}
.layers h4{font:700 1rem var(--f-d);color:var(--green)}
.layers .parts{display:inline-block;margin-top:6px;font:500 .7rem var(--f-m);color:var(--ink3)}
.layers p{margin-top:10px;font-size:.9rem;color:var(--ink2)}
.layers ul{margin:10px 0 0;padding-left:18px;font-size:.84rem;color:var(--ink2)}
.flowarrow{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:10px;font:500 .74rem var(--f-m);color:var(--ink3)}
/* section map */
.map li{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.map{list-style:none;margin:0;padding:0}
.map li:first-child{border-top:0}
.map .no{font:500 .86rem var(--f-m);color:var(--green)}
.map h4{font:700 .95rem var(--f-b)}
.map p{font-size:.86rem;color:var(--ink2);margin-top:3px}
.map .from{font:500 .7rem var(--f-m);color:var(--ink3);margin-top:5px}
.st{justify-self:end;padding:4px 10px;border-radius:999px;font:500 .7rem var(--f-m);white-space:nowrap;border:1px solid var(--line);color:var(--ink3);background:var(--sunk);cursor:pointer}
.st.rev{background:var(--goldbg);color:var(--gold);border-color:transparent}
.st.done{background:var(--tint);color:var(--green2);border-color:transparent}
:root[data-theme="dark"] .st.done{color:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 12px;font-size:.82rem;color:var(--ink3)}
/* steps of build */
.build{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:b}
.build li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);counter-increment:b}
.build li::before{content:counter(b);display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--sunk);font:500 .8rem var(--f-m);color:var(--ink2)}
.build li.now{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
.build li.now::before{background:var(--green);color:var(--surface)}
.build b{font:700 .95rem var(--f-b)}
.build p{font-size:.86rem;color:var(--ink2);margin-top:2px}
/* decisions */
.dec td:first-child{color:var(--ink);font-weight:600}
.new{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--goldbg);color:var(--gold);font:500 .64rem var(--f-m);vertical-align:middle}
.oq{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.oq label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.oq input{width:18px;height:18px;margin-top:3px;accent-color:var(--green)}
.oq span{font-size:.92rem;color:var(--ink2)}
.oq span b{color:var(--ink)}
.oq input:checked+span{color:var(--ink3);text-decoration:line-through}
.note{margin-top:10px;font:500 .74rem var(--f-m);color:var(--ink3)}
.callout{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--goldbg);color:var(--ink2);font-size:.9rem}
.callout b{color:var(--ink)}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.hide{display:none!important}
.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--ink3);text-align:center}
.foot{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font:500 .74rem var(--f-m);color:var(--ink3);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
@media (max-width:980px){.layout{grid-template-columns:1fr}.rail{position:static;max-height:none}.rail ol{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.rail a{white-space:nowrap}.rail a{border:1px solid var(--line)}.rail a span{display:none}.rail .meta{display:none}}
@media (max-width:720px){.layers{grid-template-columns:1fr}.layers>div{border-right:0;border-bottom:1px solid var(--line)}.pr .body{grid-template-columns:1fr;padding-left:16px}.map li{grid-template-columns:38px minmax(0,1fr)}.map .st{grid-column:2;justify-self:start}.vs{grid-template-columns:1fr}.vs div:nth-child(odd){border-right:0}.logo small{display:none}.hits{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- content (from the approved Master Framework, updated 1 Nov 2026) ---------- */
const PROBLEMS=[['Scattered','Families now manage blood pressure, diabetes, pregnancy, babies, elderly parents and recovery at home. The products they need are scattered across pharmacies, supermarkets, market stalls and informal sellers.'],
 ['Slow and confusing','Crowded shelves, no clear prices, no advice on which device or brand to choose, queues at the counter, and no record of what the family bought last time.'],
 ['Untrusted','Customers cannot easily tell a registered, quality product from a fake or expired one.'],
 ['Unplanned','People run out of strips, nappies or dressings and make an urgent trip, often at night, often paying more.'],
 ['Far from family','The diaspora sends money but cannot be sure it becomes the right care for a parent at home.']];
const PROMISE=[['Right product, first time','A curated range organised by need, with a free health check and advice on which item fits.'],
 ['Fast','Find and pay in under 3 minutes in store; reorder in under 30 seconds online; same-day delivery in Dar es Salaam.'],
 ['Trusted','Only registered, quality-checked products, one honest price, written warranty and aftercare.'],
 ['Planned for you','Monthly Afya Boxes arrive before you run out, with 4–5 brand choices per item at the same price, and partner care services inside every box.']];
const POS=[['A brand-led health-essentials retailer with a membership engine','A traditional pharmacy'],['Curated: fewer, better products sorted by need','A supermarket aisle of everything'],['Fast, digital, self-service where possible','A queue at a counter'],['Advice-led staff (health advisers)','Cashiers'],['One honest price','Haggling or hidden mark-ups'],['Customer-funded: every cost recovered in a price the customer chooses','A business that relies on discounts or subsidies'],['A care network: partner clinics, labs and studios deliver services inside the box','A shop that only sells products']];
const QUESTIONS=[['Is the problem real and big?','The problem, the evidence, the market size.','1.1–1.3'],['Who exactly has it?','Our customers, with real personas and their monthly spend.','1.4'],['Why now?','Rising chronic disease, mobile money, urban growth, a diaspora that pays for care.','1.5'],['What is the solution?','The Afya Basics concept and brand, shown, not described.','2.1–2.3'],['How does it work?','The customer journey, the store, the membership and its services, the technology and the operations, end to end.','3.1–4.5'],['Why will it win?','Our moat versus pharmacies, supermarkets and online sellers.','5.3'],['Does it make money?','Unit economics, the customer-funded model, the partner-service income, the financials.','6.1–6.2'],['How big can it get?','The road from Store #1 to TSh billions, with the capital each step needs.','5.4'],['What do you want from me, and what do I get?','The ask, use of funds, ownership, protections and the exit.','6.3–6.4']];
const READERS=[['Busy investor','60 seconds','The home page: one headline, one picture, five numbers, the ask'],['Interested investor','10 minutes','The ten-minute presentation, slide by slide, numbers live from the model'],['Serious investor doing checks','Hours','Every section in full, the calculators, the data room and the sources']];
const RULES=[['Show before telling','Each section opens with a realistic visual or a working demo, then explains.'],['One idea per screen','Long explanations are folded behind “Read more”.'],['Every claim has proof','A number links to its source or to the model that calculates it.'],['Risks are shown, not hidden','Each section names what could go wrong and our answer. Investors trust founders who show the bad case.'],['The ask is clear and repeated','TSh 110M seed (to be confirmed after the master-model check), what it buys, the milestones that release each tranche.']];
const LAYERS=[['Experience','Parts 3','Will customers choose Afya Basics and come back?','Visitors, check-to-purchase rate, basket size, members, churn, satisfaction, service use'],['Engine','Part 4','Can it run simply, reliably and at low cost?','Checkout time, stock-outs, on-time delivery, staff per store, cost per order, partner service quality'],['Economics','Parts 5–6','Is it a large, profitable business worth funding?','Gross margin, partner-service margin, break-even, cash, revenue growth, valuation, founders’ share']];
const WAY=[['Need first','Customers don’t know which product fits their condition','The range is organised by life situation in Care Zones: Mother & Baby, Heart & Diabetes, Mobility & Recovery, First Aid & Home, Personal Care, Seniors'],
 ['Fewer, better choices','Crowded shelves and fakes cause confusion and mistrust','About 520 product families, each registered and quality-checked, with 4–5 trusted brands per item and a clear “best for” line'],
 ['One honest price','Haggling, hidden mark-ups, prices that change by customer','One printed price on every item, the same in store, app and WhatsApp'],
 ['Check, then choose','Buying the wrong device wastes money and risks health','The free Afya Check Station and a trained health adviser come before the sale, never pressure to buy'],
 ['Pay in seconds','Queues and slow counters waste customers’ time','Scan with your phone and pay by mobile money, a self-checkout point, or the adviser’s handheld till; receipt by SMS or WhatsApp'],
 ['Never run out','Urgent night-time trips when supplies finish','Afya Box membership delivers before the family runs out; reminders, auto-renewal and free brand swaps keep it personal'],

 ['vision','Vision and positioning','Afya Basics is a new kind of health-essentials brand built for Tanzanian homes: everything a household needs to look after its health at home, curated, honestly priced, beautifully presented and bought in minutes, with the care services that go with it. This one sentence guides every design, product and technology decision in the project.',
  ()=>`<h3>The problem we solve</h3><p class="prose">Health care has moved into the home, but the shopping hasn’t.</p><div style="margin-top:12px">${cards(PROBLEMS.map((p,i)=>[p[0],p[1],'Pain '+(i+1)]))}</div>
  <h3>Our promise · Afya yako, nyumbani kwako</h3><p class="prose" style="margin-bottom:12px">Your health, at your home. Four commitments make the promise concrete.</p>${cards(PROMISE)}
  <h3>Positioning</h3><div class="vs"><div class="hd">We are</div><div class="hd">We are not</div>${POS.map(p=>`<div>${esc(p[0])}</div><div>${esc(p[1])}</div>`).join('')}</div>
  <h3>Who we serve first</h3><p class="prose">Urban households in Dar es Salaam managing a recurring health need: new and expecting mothers, carers of elderly parents, people living with hypertension or diabetes, people recovering from surgery or injury, offices and schools needing first-aid supplies, and diaspora families buying care for relatives.</p>
  <h3>The long-term ambition</h3><p class="prose">Start with one flagship store and the Afya Box membership with its partner services, prove the model, then grow store by store across Dar es Salaam, Tanzania and East Africa, towards TSh billions in annual revenue, with the founders keeping 25% of the company for life.</p>`],

  ()=>`${cards([['Afya Check in store','A monthly check fitted to the box: baby weight and growth for Mama na Mtoto, blood pressure for Presha Care, height and eyes for school children. Done by Afya staff; the cost is already in the store’s running costs.','Layer 1 · free'],['Partner care pack','One professional service from a partner on a fixed schedule: a baby massage every month, an HbA1c lab test every 3 months, a dental check twice a year. Priced into the box.','Layer 2 · included'],['Digital care','Reminders, a nurse or adviser on WhatsApp, reports to family abroad. It costs almost nothing per member, so it is free.','Layer 3 · free'],['Partner add-ons','Any service can also be added to the package every month (about 87% of the normal price, prepaid) or booked once in the app or store (90%; the partner pays Afya 10%).','Layer 4 · optional']])}

   <tr><td class="k">1 · Member rate</td><td>70% of the partner’s walk-in price, rounded to TSh 500</td><td class="num">70% × TSh 25,000 = <b>TSh 17,500</b> per baby massage</td></tr>
   <tr><td class="k">2 · Partner cost per month</td><td>Member rate × visits per year ÷ 12</td><td class="num">17,500 × 12 ÷ 12 = <b>TSh 17,500</b></td></tr>
   <tr><td class="k">3 · Care-pack fee</td><td>Partner cost × 1.25, rounded up to the next TSh 500</td><td class="num">17,500 × 1.25 = 21,875 → <b>TSh 22,000</b></td></tr>
   <tr><td class="k">4 · Afya keeps</td><td>Fee − partner cost</td><td class="num">22,000 − 17,500 = <b>TSh 4,500</b> (20.5%)</td></tr>

  <h3>The services in every box</h3><p class="prose" style="margin-bottom:12px">The 17 boxes sit in seven groups, by who the box is for: mother and baby, children and teens, women and men, people living with a condition, older adults and people recovering, the home, and workplaces.</p>${table(['Group','Box','Included partner service','Schedule','Care-pack fee / month'],[['Mother & baby','Mama Mjamzito','Prenatal class','6 a year','TSh 9,000'],['','Mama na Mtoto','Baby massage session','Monthly','TSh 22,000'],

['Women & men','Afya Glow','Facial skin treatment','4 a year','TSh 12,000'],['','Afya Siku','Gynaecology check-up','1 a year','TSh 3,000'],['','Afya Man','Barber grooming session','Monthly','TSh 9,000'],
['Living with a condition','Sukari Care','HbA1c lab test','4 a year','TSh 9,000'],['','Presha Care','Cholesterol and kidney lab test','2 a year','TSh 6,000'],['','Figo Care','Renal diet consult','4 a year','TSh 9,000'],

['Workplaces','Afya Ofisi','First-aid training seat','2 a year','TSh 7,500'],['','Afya Hoteli','Pest-control visit','4 a year','TSh 23,500']])}
  <div class="callout"><b>Master model v1.1, base case.</b> Average care-pack fee TSh 12,585 per member a month; extra gross profit TSh 3,357 per member a month (TSh 2,663 margin + TSh 694 commission). With 600 members in month 12, service income is about TSh 8.0M that month and about TSh 6.0M is paid to partner businesses. Year 1: TSh 45.6M service income, adding TSh 11.5M of gross profit; the first profitable month moves from month 6 to month 5. With Afya Kazini (chapter 6), total year-1 revenue is TSh 914M.</div>
  <h3>The rules that keep it trusted</h3>${ul(['Only licensed providers, checked before signing.','Afya never diagnoses. A worrying reading is referred to the member’s own clinic, whether or not it is a partner.','The commission is a disclosed booking fee on add-ons only; it never changes a referral.','Members rate every visit; a partner below 4 stars for two months is replaced.','No partner agreement exists yet; every price is replaced by written quotations during on-the-ground research.'])}`],
 ['kazini','Afya Kazini: the business membership','Afya Kazini (“health at work”) is the Afya membership for businesses of every size. Every business needs the same things every month: a first-aid box that is actually full, soap for staff, cleaning supplies, people trained in first aid, and healthy staff. Tanzanian law asks for most of this, and most businesses buy it once and forget it. Afya Kazini delivers it monthly, keeps the business ready for an inspection, and turns every employee into a possible Afya family.',
  ()=>`<h3>Three sizes, matched to the law</h3>${table(['Size','Who','What they get','Price (planning estimate)'],[['Kazini Ndogo · 1–9 staff','Shops, kiosks, restaurants, salons, workshops, small offices','Core kit + a sector kit; first-aid training seat and fire-extinguisher service each year','TSh 60,000 – 89,500 a month'],['Kazini Kati · 10–50 staff','Offices, clinics, schools, NGOs; Afya Hoteli for hotels','Afya Ofisi box per 25 staff: the OSH band of one first-aid box and two trained first aiders, plus a monthly staff BP and BMI screening day','TSh 175,000 per 25 staff a month'],['Kazini Kubwa · 51+ staff','Factories, banks, large schools','Afya Ofisi units per 25 staff on 6 or 12-month plans, on-site check days, one invoice with 30 days to pay','TSh 159,500 – 164,500 per 25 staff a month']])}
  <h3>Four parts, the same for every business</h3>${cards([['Supplies the law asks for','First-aid refills, soap for employees (OSH Rules 2015, rule 7(3)(d)), cleaning for the staff toilet, and a kit for the sector.','Part 1 · monthly'],['Safety services','An accredited first-aid training seat and a fire-extinguisher service every year; pest control twice a year for food businesses. Priced in with the same 25% markup as Afya Huduma.','Part 2 · partners'],['Staff health','Every employee gets an Afya Staff Card: free Afya Checks, member prices, and family boxes paid by mobile money, payroll deduction, or the employer as a staff benefit.','Part 3 · free'],['The Afya Kazini seal','A window sticker and a digital record: kit checked at every delivery, first aiders trained, extinguisher serviced. It is Afya’s own standard, not a government certificate.','Part 4 · earned monthly']])}
  <h3>Kazini Ndogo: five sector kits</h3>${table(['Sector kit','Who','Extra items on top of the core kit','Price / month','Business saves'],[['Kazini Duka','Shops and kiosks','Pocket sanitisers, disinfecting wipes','TSh 60,000','22%'],['Kazini Chakula','Restaurants and food stalls','Gloves, kitchen wipes, burn gel; pest control 2 a year','TSh 89,500','21%'],['Kazini Saluni','Salons and barbershops','Gloves, disinfecting wipes, clipper blade oil','TSh 81,000','22%'],['Kazini Karakana','Workshops and building sites','Eye-wash, gloves, burn gel, ear plugs','TSh 83,000','22%'],['Kazini Ofisi Ndogo','Small offices','Disinfecting wipes, face masks','TSh 65,500','22%']])}
  <p class="note">Core kit (every sector): quarterly first-aid refill, plasters, 2 hand washes, sanitiser, disinfectant, toilet cleaner, paper towels · TSh 44,440 at shelf price. Price = supplies × 0.92 + safety fee + TSh 5,500 delivery, rounded to TSh 500. “Saves” compares buying it alone at small-shop prices (+18%), 4 trips of TSh 2,000 and walk-in service prices, the same comparison as section 3.5.</p>
  <div class="callout"><b>Master model v1.2, base case.</b> 40 Kazini Ndogo accounts by month 12 (about 3 new a month), average TSh 75,625 a month and TSh 21,286 gross profit per account. Month 12: TSh 3.0M revenue. Year 1: TSh 19.7M revenue and TSh 5.5M gross profit; total year-1 revenue becomes TSh 914M. About 160 staff are reached through small businesses by month 12; their family boxes count inside the 600-member plan, not on top of it.</div>
  <h3>Why it wins</h3>${ul(['One subscription, ready for inspection: supplies, first aiders and fire safety in one monthly payment, with a record the owner can show an inspector.','A seal customers can see: salons, restaurants and shops show the sticker, which puts the Afya name in every street.','Every business brings its staff: each account is a channel to new family members at almost no marketing cost.','Paid like a business pays: mobile money for small businesses, one invoice with 30 days to pay for large ones.','Customer-funded: services carry the 25% markup and delivery is inside the price, so every account earns from its first month.'])}
  <p class="note">Legal basis: <a href="https://tanzlii.org/en/akn/tz/act/gn/2015/147/eng@2015-04-03" target="_blank" rel="noopener">Occupational Safety and Health (First Aid and Welfare Facilities) Rules, 2015 (GN 147)</a>: rule 4(2)(e) one first-aid box and two trained first aiders for 10–50 employees; rule 4(4) kept clean and ready for use; rule 7(3)(d) soap for employees; rule 12 safe drinking water and cups.</p>`],
 ['journey','The customer journey and speed targets','Speed is a promise we measure: a walk-in customer finds and pays in under 3 minutes, a repeat online order takes under 30 seconds, and a member’s monthly box needs zero clicks. Choose a journey to see it step by step.',

  <h3>Speed targets the system must hit</h3>${table(['Moment','Target','How the system achieves it'],SPEED)}`],
 ['system','Simple operations: the one-system model','One connected system runs the whole business, so a store can be run by a small team and the founders can manage it from a phone in India. Every action is recorded once and every screen, report, reorder and partner payout updates from it automatically.',
  ()=>`<h3>The modules of the one system</h3>${table(['Module','What it does','Who uses it','What it removes from people’s work'],MODULES)}

  <h3>How it is built</h3><p class="prose">Start with proven ready-made tools where they exist (a retail point-of-sale system, payment provider, WhatsApp Business, accounting) and connect them to our own Afya platform for memberships, Afya Choice, partner bookings, the dashboard and reports. Build our own only where it gives us an advantage.</p>`],

  ()=>`<div class="tw"><table><thead><tr><th>#</th><th>Block</th><th>What it contains</th><th>Quality test</th></tr></thead><tbody>${TEMPLATE.map((t,i)=>`<tr><td class="k num">${i+1}</td><td><b>${esc(t[0])}</b></td><td>${esc(t[1])}</td><td>${esc(t[2])}</td></tr>`).join('')}</tbody></table></div>

 ['model','The master model: one source of truth','Every number in the website, the deck, the films and the documents comes from one master model; change an assumption once and every page updates. Conflicting numbers destroy investor trust faster than anything else. Current version: v1.2 (v1.1 added Afya Huduma; v1.2 adds Afya Kazini).',

 ['build','Build order and working method','We build in eight steps, and inside the content steps we work one section at a time: agree it, research it, write it, design it, test it, sign it off, then move on. Nothing moves forward until the current item meets its definition of done.',
  ()=>`<h3>The eight steps</h3><ol class="build">${STEPS8.map(s=>`<li class="${s[2]==='now'?'now':''}"><div><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div><span class="st ${s[2]==='done'?'done':s[2]==='now'?'rev':''}">${s[2]==='done'?'Done':s[2]==='now'?'In progress':'Later'}</span></li>`).join('')}</ol>

 ['decisions','Decisions taken and open questions','Thirteen decisions are agreed; nine questions remain open and will be settled at the step where they matter. Tick a question when it is settled; ticks are saved in this browser only.',
  ()=>`<h3>Decisions taken</h3><div class="tw"><table class="dec"><thead><tr><th>Decision</th><th>Agreed</th></tr></thead><tbody>${DECISIONS.map(d=>`<tr><td>${esc(d[0])}${d[2]?'<span class="new">New</span>':''}</td><td class="num">${esc(d[1])}</td></tr>`).join('')}</tbody></table></div>
  <h3>Open questions</h3><ul class="oq" id="oq">${OPEN.map(o=>`<li><label for="oq-${o[0]}"><input type="checkbox" id="oq-${o[0]}" data-k="${o[0]}"><span>${esc(o[1])}</span></label></li>`).join('')}</ul><p class="note" id="oqn"></p>`]];

/* ---------- render ---------- */
const main=$('#main');
main.innerHTML=`<section class="hero"><div class="eyebrow">Afya Basics Simple Solution Ltd · Dar es Salaam</div><h1>The master framework for the investor showroom</h1>
 <p>How the whole Afya Basics project is organised: what we promise, the story an investor follows, the three layers, our own retail principles, the services and partners inside every box, the business membership, the one system that runs it, the 36 sections, the design, the master model and the decisions taken so far.</p>
 <p class="motto">Afya yako, nyumbani kwako.</p>
 <div class="facts"><span>15 chapters</span><span>36 sections · 8 parts</span><span>17 Afya Boxes + Afya Kazini</span><span>Master model v1.2</span><span>Updated 1 Nov 2026</span></div></section>`+
 CH.map((c,i)=>`<section class="s" id="${c[0]}" data-s><div class="sh"><span class="n">${String(i+1).padStart(2,'0')}</span><h2>${esc(c[1])}</h2></div><p class="lead">${esc(c[2])}</p>${c[3]()}</section>`).join('')+
 `<div class="empty hide" id="empty">No chapter mentions that. Try a shorter word, such as “box”, “TMDA” or “partner”.</div><footer class="foot"><span>Afya Basics · Master framework</span><span>Prepared with Fahmy Abbas and Cecilia · planning document, figures are estimates</span></footer>`;
$('#toc').innerHTML=CH.map((c,i)=>`<li><a href="#${c[0]}" data-t="${c[0]}"><span>${String(i+1).padStart(2,'0')}</span>${esc(c[1])}</a></li>`).join('');

/* journeys */
function showJ(i){const j=JOURNEYS[i];$$('#jtabs button').forEach((b,k)=>b.setAttribute('aria-selected',k===i));
 $('#jpanel').innerHTML=`<div class="jtop"><b>Journey ${j[0]} · ${esc(j[1])}</b><span class="target">Target: ${esc(j[2])}</span></div><ol class="steps">${j[3].map(s=>`<li><span><b>${esc(s[0])}.</b> ${esc(s[2])}</span><code>${esc(s[1])}</code></li>`).join('')}</ol>`}
$$('#jtabs button').forEach(b=>b.onclick=()=>showJ(+b.dataset.j));showJ(0);

/* section map with per-viewer status */
const ST=['draft','rev','done'],STL={draft:'Not started',rev:'In review',done:'Signed off'};
let stat=store.get('afyaFwStatus',{});
const sOf=(no,def)=>stat[no]||def;
function progress(){let all=0,done=0,rev=0;MAP.forEach(p=>p[2].forEach(s=>{all++;const v=sOf(s[0],s[4]);if(v==='done')done++;if(v==='rev')rev++}));
 $('#mapProg').textContent=`${done} signed off · ${rev} in review · ${all} sections`;$('#mapBar').style.width=((done+rev*.5)/all*100)+'%'}
let mi=0;function showM(i){mi=i;$$('#mtabs button').forEach((b,k)=>b.setAttribute('aria-selected',k===i));
 $('#mlist').innerHTML=MAP[i][2].map(s=>{const v=sOf(s[0],s[4]);return `<li><span class="no">${s[0]}</span><div><h4>${esc(s[1])}</h4><p>${esc(s[2])}</p><div class="from">Comes from: ${esc(s[3])}</div></div><button type="button" class="st ${v==='draft'?'':v}" data-no="${s[0]}" data-def="${s[4]}" aria-label="Status of ${s[0]}: ${STL[v]}. Click to change.">${STL[v]}</button></li>`}).join('');
 $$('#mlist .st').forEach(b=>b.onclick=()=>{const cur=sOf(b.dataset.no,b.dataset.def);stat[b.dataset.no]=ST[(ST.indexOf(cur)+1)%3];store.set('afyaFwStatus',stat);showM(mi);progress()})}
$$('#mtabs button').forEach(b=>b.onclick=()=>showM(+b.dataset.m));showM(0);progress();

/* open questions */
let oq=store.get('afyaFwOpen',{});
function oqNote(){const n=OPEN.filter(o=>oq[o[0]]).length;$('#oqn').textContent=`${n} of ${OPEN.length} settled`}
$$('#oq input').forEach(c=>{c.checked=!!oq[c.dataset.k];c.onchange=()=>{oq[c.dataset.k]=c.checked;store.set('afyaFwOpen',oq);oqNote()}});oqNote();

/* scroll spy */
const links=$$('#toc a');const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle('cur',a.dataset.t===e.target.id))}})},{rootMargin:'-30% 0px -60% 0px'});
$$('section[data-s]').forEach(s=>io.observe(s));

/* search: open accordions, show matching chapters, highlight */
const orig=new Map();$$('section[data-s]').forEach(s=>orig.set(s,s.innerHTML));
let t=null;$('#q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>search(e.target.value.trim()),150)});
function search(q){let shown=0,hits=0;
 $$('section[data-s]').forEach(s=>{s.innerHTML=orig.get(s)});rewire();
 if(!q){$$('section[data-s]').forEach(s=>s.classList.remove('hide'));$('#empty').classList.add('hide');$('#hits').textContent='';links.forEach(a=>a.parentElement.classList.remove('hide'));return}
 const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
 $$('section[data-s]').forEach(s=>{const has=re.test(s.textContent);re.lastIndex=0;s.classList.toggle('hide',!has);links.find(a=>a.dataset.t===s.id).parentElement.classList.toggle('hide',!has);
  if(has){shown++;s.querySelectorAll('details').forEach(d=>{if(re.test(d.textContent))d.open=true;re.lastIndex=0});
   const w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
   nodes.forEach(n=>{if(!n.nodeValue.match(re)||n.parentElement.closest('button,input'))return;const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>{hits++;return `<mark>${m}</mark>`});n.replaceWith(sp)})}});
 $('#empty').classList.toggle('hide',shown>0);$('#hits').textContent=`${hits} match${hits===1?'':'es'} in ${shown} chapter${shown===1?'':'s'}`}
function rewire(){$$('#jtabs button').forEach(b=>b.onclick=()=>showJ(+b.dataset.j));showJ(Math.max(0,$$('#jtabs button').findIndex(b=>b.getAttribute('aria-selected')==='true')));
 $$('#mtabs button').forEach(b=>b.onclick=()=>showM(+b.dataset.m));showM(mi);
 $$('#oq input').forEach(c=>{c.checked=!!oq[c.dataset.k];c.onchange=()=>{oq[c.dataset.k]=c.checked;store.set('afyaFwOpen',oq);oqNote()}});oqNote()}
</script>
